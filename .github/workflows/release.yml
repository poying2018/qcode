name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则用 package.json 里的 version）'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装构建依赖
        run: npm ci

      - name: 准备内置内核
        shell: pwsh
        run: |
          # build/kernel 不进版本库（node.exe 约 92MB + 运行树），按 docs/BUILDING.md 现场生成。
          # 必须先写一个 package.json：否则 npm 会一路向上找到仓库根的 package.json，
          # 把依赖装到 <repo>/node_modules，build/kernel/node_modules 里什么都没有。
          New-Item -ItemType Directory -Force build\kernel | Out-Null
          Copy-Item (Get-Command node).Source build\kernel\node.exe
          Set-Content 'build\kernel\package.json' '{"name":"qcode-kernel","private":true}' -Encoding ascii

          Push-Location build\kernel
          npm install --omit=dev --no-save --no-audit --no-fund @qwen-code/qwen-code
          Pop-Location

          $pkgDir = 'build\kernel\node_modules\@qwen-code\qwen-code'
          if (-not (Test-Path $pkgDir)) { throw "内核包未安装：$pkgDir" }
          $pkg = Get-Content (Join-Path $pkgDir 'package.json') -Raw | ConvertFrom-Json
          "内核版本：$($pkg.version)"

          $bin = $pkg.bin
          $entryName = if ($bin -is [string]) { $bin } elseif ($bin.qwen) { $bin.qwen } else { 'cli-entry.js' }
          $entry = Join-Path $pkgDir $entryName
          if (-not (Test-Path $entry)) {
            "包内实际文件："
            Get-ChildItem $pkgDir -Name | Select-Object -First 30
            throw "内核入口缺失：$entry（见 docs/BUILDING.md）"
          }
          "内核就绪：node.exe $((Get-Item 'build\kernel\node.exe').Length) B + $entry"

      - name: 方言检查
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer/app.js

      - name: 打包
        shell: pwsh
        env:
          # electron-builder 在 CI 的 tag 构建里会自动尝试上传到 GitHub，
          # 这里只负责出包，发布交给后面的 gh 步骤（--publish never 关掉自动发布）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist -- --publish never
          Get-ChildItem dist -Filter '*.exe' | Select-Object Name, Length
          Get-ChildItem dist -Filter '*.zip' | Select-Object Name, Length

      - name: 生成校验和
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lines = @()
          foreach ($f in @("Qcode-$v-win.zip", "Qcode-Setup-$v.exe")) {
            $p = Join-Path 'dist' $f
            if (-not (Test-Path $p)) { throw "缺少产物：$p" }
            $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $f"
            "$f  $h"
          }
          $lines += '# built by GitHub Actions on ' + (Get-Date -Format 'yyyy-MM-dd HH:mm:ss') + ' UTC' + (Get-Date).ToUniversalTime().ToString('zzz')
          Set-Content "dist\SHA256SUMS-$v.txt" $lines -Encoding ascii

      - name: 上传构建产物（Actions artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: qcode-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

      - name: 解析版本与标签
        id: meta
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $input = '${{ inputs.version }}'
          if ($input) { $v = $input }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "发布版本：$v"

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.meta.outputs.version }}'
          $tag = '${{ steps.meta.outputs.tag }}'
          $zip = "dist\Qcode-$v-win.zip"
          $exe = "dist\Qcode-Setup-$v.exe"
          $sums = "dist\SHA256SUMS-$v.txt"

          $exists = $true
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { $exists = $false }

          if ($exists) {
            "Release $tag 已存在，覆盖附件"
            gh release upload $tag $zip $exe $sums --clobber
          } else {
            "创建 Release $tag"
            $notes = if (Test-Path "RELEASE-NOTES-$v.md") { "RELEASE-NOTES-$v.md" } else { "README.md" }
            gh release create $tag $zip $exe $sums --title "Qcode $v" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "发布失败（exit=$LASTEXITCODE）" }

      - name: 汇总
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.meta.outputs.version }}'
          "=== Release v$v ==="
          gh release view "v$v" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size) \(.state)")'
